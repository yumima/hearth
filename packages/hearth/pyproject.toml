[project]
name = "hearth"
dynamic = ["version"]
description = "Hearth — a stable, OpenAI-compatible local AI engine on loopback. Fronts Ollama (and later llama.cpp/vLLM/faster-whisper) behind one HTTP API with a role registry, hardware probe, and tool-call repair."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "yumima" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "psutil>=6.0",              # other processes and memory, on every system
    "python-multipart>=0.0.9",  # multipart parsing for /v1/audio/transcriptions
]

[project.optional-dependencies]
stt = [
    # M2: faster-whisper for /v1/audio/transcriptions. Installed into a
    # separate interpreter when the host Python lacks ctranslate2 wheels.
    "faster-whisper>=1.0",
]
tts = [
    # Natural read-aloud voices (Kokoro-82M, ONNX). Optional: without it
    # /v1/audio/speech serves Piper. `hearth voice --voice kokoro` installs it
    # and fetches the model files.
    "kokoro-onnx>=0.4,<0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout",
    "numpy",  # the read-aloud tests run Kokoro's audio code without Kokoro (the tts extra brings it)
]

[project.scripts]
hearth = "hearth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# The one place the version is written (read without importing the package).
version = { attr = "hearth.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120  # what hangs says where, and ends
