<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth</title>
<!--
  Hearth chat UI. Served by the client's local server (same-origin), which proxies
  /api/chat + /api/models to the configured backend (default: local hearth). No
  external/CDN resources — everything (styles, icons, the small Markdown
  renderer, the voice engine) is inline.
-->
<style>
  :root {
    --bg: #1c1c1e; --bg-side: #161618; --bg-elev: #252528; --bg-input: #2a2a2e; --bg-hover: #303035;
    --border: #38383e; --border-strong: #4a4a52;
    --text: #ececef; --text-dim: #9d9da6; --text-faint: #6f6f78;
    --accent: #6ea8fe; --accent-strong: #8db9ff; --accent-soft: rgba(110,168,254,.14); --on-accent: #0f1420;
    --ok: #5fc27a; --warn: #e2b04a; --err: #ec7a5c; --ok-soft: rgba(95,194,122,.14); --err-soft: rgba(236,122,92,.14);
    --user-bg: #2c2c31; --code-bg: #131315;
    --shadow: 0 12px 40px rgba(0,0,0,.45);
    --radius: 14px; --maxw: 740px; --side: 264px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #fbfaf7; --bg-side: #f2f0ea; --bg-elev: #ffffff; --bg-input: #ffffff; --bg-hover: #ebe8e0;
      --border: #e1ded5; --border-strong: #c9c5ba;
      --text: #1d1d1f; --text-dim: #66646c; --text-faint: #9a979f;
      --accent: #2f6fdc; --accent-strong: #1f5bc4; --accent-soft: rgba(47,111,220,.10); --on-accent: #ffffff;
      --ok: #2e9a50; --warn: #b07d10; --err: #c9502f; --ok-soft: rgba(46,154,80,.10); --err-soft: rgba(201,80,47,.10);
      --user-bg: #efece4; --code-bg: #f4f2ec;
      --shadow: 0 12px 40px rgba(30,25,10,.14);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #fbfaf7; --bg-side: #f2f0ea; --bg-elev: #ffffff; --bg-input: #ffffff; --bg-hover: #ebe8e0;
    --border: #e1ded5; --border-strong: #c9c5ba;
    --text: #1d1d1f; --text-dim: #66646c; --text-faint: #9a979f;
    --accent: #2f6fdc; --accent-strong: #1f5bc4; --accent-soft: rgba(47,111,220,.10); --on-accent: #ffffff;
    --ok: #2e9a50; --warn: #b07d10; --err: #c9502f; --ok-soft: rgba(46,154,80,.10); --err-soft: rgba(201,80,47,.10);
    --user-bg: #efece4; --code-bg: #f4f2ec;
    --shadow: 0 12px 40px rgba(30,25,10,.14);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); display: flex; overflow: hidden;
    font: 15px/1.6 -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  .ico { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  .hidden { display: none !important; }

  /* ── sidebar ─────────────────────────────────────────────────────────────── */
  #sidebar { flex: 0 0 var(--side); width: var(--side); background: var(--bg-side); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; transition: margin-left .2s ease; z-index: 60; }
  body.side-collapsed #sidebar { margin-left: calc(-1 * var(--side)); }
  .sideHead { display: flex; align-items: center; gap: 8px; padding: 12px 12px 6px 16px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15.5px; flex: 1 1 auto; }
  .brand svg { width: 22px; height: 22px; color: var(--accent); }
  .iconbtn { width: 34px; height: 34px; border: 0; border-radius: 9px; background: transparent; color: var(--text-dim);
    display: grid; place-items: center; cursor: pointer; flex: 0 0 auto; position: relative; }
  .iconbtn:hover { background: var(--bg-hover); color: var(--text); }
  .iconbtn:focus-visible, .navbtn:focus-visible, .pbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sideNav { padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
  .navbtn { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: transparent;
    padding: 8px 10px; border-radius: 9px; cursor: pointer; text-align: left; font-size: 14px; color: var(--text); }
  .navbtn:hover { background: var(--bg-hover); }
  .navbtn.active { background: var(--bg-hover); font-weight: 600; }
  .navbtn .badge { margin-left: auto; font-size: 11px; background: var(--accent-soft); color: var(--accent);
    border-radius: 99px; padding: 1px 8px; font-weight: 600; }
  .sideLabel { padding: 14px 18px 4px; font-size: 12px; color: var(--text-faint); font-weight: 600; }
  #recents { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 0 8px 8px; min-height: 0; }
  .recent { display: flex; align-items: center; border-radius: 9px; }
  .recent:hover, .recent.active { background: var(--bg-hover); }
  .recent .rt { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; text-align: left; cursor: pointer;
    padding: 7px 10px; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .recent .rx { opacity: 0; width: 28px; height: 28px; }
  .recent:hover .rx, .recent .rx:focus-visible { opacity: 1; }
  .recentsEmpty { padding: 6px 12px; font-size: 13px; color: var(--text-faint); }
  .sideFoot { border-top: 1px solid var(--border); padding: 8px; display: flex; align-items: center; gap: 4px; }
  .conn { flex: 1 1 auto; display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12.5px;
    color: var(--text-dim); min-width: 0; }
  .conn span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); flex: 0 0 auto; }
  .dot.up { background: var(--ok); } .dot.down { background: var(--err); }
  #sideScrim { display: none; }

  /* ── main column ─────────────────────────────────────────────────────────── */
  #main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; height: 100%; position: relative; }
  .topbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 14px; min-height: 54px; }
  .topTitle { font-size: 14px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; }
  #sideOpen { display: none; }
  body.side-collapsed #sideOpen { display: grid; }
  .lessonChip { display: flex; align-items: center; gap: 8px; background: var(--accent-soft); color: var(--accent);
    border-radius: 99px; padding: 4px 6px 4px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .lessonChip button { border: 0; background: var(--bg-elev); color: var(--text); border-radius: 99px; padding: 3px 11px;
    font-size: 12.5px; cursor: pointer; font-weight: 500; }
  .lessonChip button:hover { background: var(--bg-hover); }
  .view { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #scroller { flex: 1 1 auto; overflow-y: auto; }
  #thread { max-width: var(--maxw); margin: 0 auto; padding: 8px 20px 24px; }

  /* empty state: greeting + composer centred, like a fresh Claude / Gemini chat */
  #hello { display: none; text-align: center; padding: 0 20px; }
  body.fresh #hello { display: block; }
  body.fresh #scroller { flex: 0 1 auto; margin-top: auto; }
  body.fresh #chatView footer { margin-bottom: auto; }
  #hello h1 { font-size: 30px; font-weight: 500; letter-spacing: -.3px; margin: 0 0 6px; }
  #hello h1 .spark { color: var(--accent); }
  #hello p { margin: 0 0 26px; color: var(--text-dim); }
  .suggest { display: none; max-width: var(--maxw); margin: 14px auto 0; padding: 0 20px; gap: 8px; flex-wrap: wrap; justify-content: center; }
  body.fresh .suggest { display: flex; }
  .sbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: transparent;
    border-radius: 99px; padding: 7px 14px; font-size: 13.5px; color: var(--text-dim); cursor: pointer; }
  .sbtn:hover { background: var(--bg-hover); color: var(--text); }
  .sbtn .ico { width: 16px; height: 16px; }

  /* ── messages ───────────────────────────────────────────────────────────── */
  .msg { margin: 0 0 26px; }
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
  .msg.user .bubble { background: var(--user-bg); border-radius: 18px 18px 4px 18px; padding: 9px 15px; max-width: 82%;
    white-space: pre-wrap; word-wrap: break-word; }
  .msg.system { font-size: 13px; color: var(--text-dim); text-align: center; }
  .msg.system code { font-size: 12px; }
  .msg.system.left { text-align: left; }
  .content { word-wrap: break-word; }
  .content > *:first-child { margin-top: 0; } .content > *:last-child { margin-bottom: 0; }
  .content p { margin: 0 0 12px; }
  .content h1,.content h2,.content h3 { margin: 18px 0 8px; line-height: 1.3; }
  .content h1 { font-size: 1.35em; } .content h2 { font-size: 1.18em; } .content h3 { font-size: 1.04em; }
  .content ul,.content ol { margin: 0 0 12px; padding-left: 24px; } .content li { margin: 3px 0; }
  .content blockquote { margin: 0 0 12px; padding: 2px 14px; border-left: 3px solid var(--border-strong); color: var(--text-dim); }
  .content a { color: var(--accent); }
  .content table.md { border-collapse: collapse; margin: 0 0 14px; font-size: .94em; display: block; overflow-x: auto; max-width: 100%; }
  .content table.md th, .content table.md td { border: 1px solid var(--border); padding: 6px 11px; text-align: left; vertical-align: top; }
  .content table.md th { background: var(--bg-elev); font-weight: 650; }
  code.inline { background: var(--code-bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-size: .88em;
    font-family: "SFMono-Regular", "JetBrains Mono", Consolas, monospace; }
  .codewrap { position: relative; margin: 0 0 14px; }
  .codewrap pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; overflow-x: auto; margin: 0; }
  .codewrap code { font-family: "SFMono-Regular", "JetBrains Mono", Consolas, monospace; font-size: 13px; line-height: 1.55; }
  .copy { position: absolute; top: 7px; right: 7px; font-size: 11.5px; padding: 3px 9px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-dim); opacity: 0; transition: opacity .12s; }
  .codewrap:hover .copy { opacity: 1; }
  .cursor::after { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--text);
    margin-left: 4px; vertical-align: middle; animation: breathe 1s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  /* target-language phrase (tutor writes {{…}}): highlighted, click to hear it */
  .tl { color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 0 5px; cursor: pointer;
    font-weight: 550; white-space: normal; }
  .tl:hover { text-decoration: underline; text-underline-offset: 3px; }
  .tl.saved { box-shadow: inset 0 -2px 0 var(--accent); }
  /* tutor correction line (✏️ …) */
  .corr { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 12px; padding: 9px 12px; border-radius: 10px;
    background: var(--ok-soft); font-size: 14px; }
  .corr .ico { color: var(--ok); margin-top: 3px; width: 16px; height: 16px; }
  /* thinking + tool activity */
  .think { margin: 0 0 12px; }
  .think summary { cursor: pointer; list-style: none; font-size: 13.5px; color: var(--text-dim); display: inline-flex;
    align-items: center; gap: 6px; user-select: none; }
  .think summary::-webkit-details-marker { display: none; }
  .think summary .chev { transition: transform .15s; width: 14px; height: 14px; }
  .think[open] summary .chev { transform: rotate(90deg); }
  .think .reason { margin-top: 8px; padding: 2px 0 2px 14px; border-left: 2px solid var(--border); white-space: pre-wrap;
    color: var(--text-dim); font-size: 13.5px; max-height: 320px; overflow-y: auto; }
  .shimmer { background: linear-gradient(90deg, var(--text-dim) 0%, var(--text) 45%, var(--text-dim) 90%);
    background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important;
    animation: shimmer 1.6s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .tools { display: flex; flex-direction: column; gap: 5px; margin: 0 0 12px; }
  .tool { font-size: 13px; color: var(--text-dim); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
  .tool .tn { color: var(--text); }
  .tool code { font-size: 12px; }
  .tool .args { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11.5px; color: var(--text-faint); word-break: break-all; }
  .tool .ok { color: var(--ok); } .tool .no { color: var(--err); }
  .tool .res { cursor: pointer; } .tool .res:hover { color: var(--text); }
  .tool .more { color: var(--accent); font-size: 11.5px; }
  .tool .resfull { flex: 1 0 100%; white-space: pre-wrap; word-break: break-word; background: var(--code-bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 11.5px; color: var(--text); max-height: 320px; overflow: auto; }
  .tool .genimg { display: block; flex: 1 0 100%; max-width: 380px; border-radius: 10px; margin-top: 6px; border: 1px solid var(--border); }
  .tool.note { font-style: italic; }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent);
    animation: rot .8s linear infinite; display: inline-block; vertical-align: -1px; }
  @keyframes rot { to { transform: rotate(360deg); } }
  /* message actions (copy / read aloud / retry) */
  .actions { display: flex; gap: 2px; margin-top: 6px; opacity: 0; transition: opacity .12s; }
  .msg:hover .actions, .msg.last .actions, .actions:focus-within { opacity: 1; }
  .actions .iconbtn { width: 30px; height: 30px; }
  .actions .iconbtn .ico { width: 16px; height: 16px; }
  .actions .iconbtn.on { color: var(--accent); }
  .msg.user .actions { justify-content: flex-end; }
  .msg .att { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; justify-content: flex-end; }
  .msg .att img { max-width: 220px; max-height: 220px; border-radius: 10px; border: 1px solid var(--border); }
  .errline { color: var(--err); }
  /* tooltips for icon buttons */
  [data-tip]::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%;
    transform: translateX(-50%) translateY(3px); background: var(--text); color: var(--bg); font-size: 11.5px; font-weight: 500;
    line-height: 1.2; padding: 4px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none; opacity: 0;
    transition: opacity .1s, transform .1s; z-index: 90; }
  [data-tip]:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); transition-delay: .35s; }
  .sideFoot [data-tip]::after, .sideHead [data-tip]::after { bottom: auto; top: calc(100% + 6px); }

  /* ── composer ───────────────────────────────────────────────────────────── */
  footer { flex: 0 0 auto; padding: 0 20px 14px; }
  .composer { max-width: var(--maxw); margin: 0 auto; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 24px; padding: 12px 12px 8px 18px; position: relative; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .composer:focus-within { border-color: var(--border-strong); }
  .composer.drag { border-color: var(--accent); background: var(--accent-soft); }
  #input { width: 100%; background: transparent; border: 0; color: var(--text); resize: none; font: inherit;
    line-height: 1.5; max-height: 240px; outline: none; padding: 2px 0 6px; display: block; }
  #input::placeholder { color: var(--text-faint); }
  .compRow { display: flex; align-items: center; gap: 4px; margin-left: -8px; }
  .compRow .grow { flex: 1 1 auto; }
  .pillsel, .pbtn { height: 32px; border-radius: 99px; border: 1px solid transparent; background: transparent; color: var(--text-dim);
    font-size: 13px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .pillsel { max-width: 170px; width: auto; field-sizing: content; appearance: none; -webkit-appearance: none; padding-right: 22px;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 13px) 14px, calc(100% - 9px) 14px; background-size: 4px 4px; background-repeat: no-repeat; }
  .pillsel:hover, .pbtn:hover { background-color: var(--bg-hover); color: var(--text); }
  .pillsel option { background: var(--bg-elev); color: var(--text); }
  .pbtn.on { color: var(--accent); background: var(--accent-soft); }
  .pbtn .ico { width: 16px; height: 16px; }
  #sendbtn, #voicebtn { width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; position: relative; }
  #sendbtn { background: var(--text); color: var(--bg); }
  #sendbtn:disabled { opacity: .3; cursor: default; }
  #sendbtn.stop { background: var(--text); }
  #voicebtn { background: var(--accent); color: var(--on-accent); }
  #voicebtn:hover { background: var(--accent-strong); }
  #dictbtn.hot { color: var(--err); background: var(--err-soft); }
  .hint { max-width: var(--maxw); margin: 8px auto 0; font-size: 11.5px; color: var(--text-faint); text-align: center; }
  .attachbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 10px; padding: 4px 4px 4px 8px; font-size: 12.5px; color: var(--text-dim); max-width: 240px; }
  .chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 5px; }
  .chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .x { cursor: pointer; border: 0; background: none; color: var(--text-faint); padding: 0 4px; font-size: 16px; line-height: 1; }
  .chip .x:hover { color: var(--err); }
  /* slash-command palette */
  .palette { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 20; background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); max-height: 300px; overflow-y: auto; padding: 5px; }
  .pitem { display: flex; align-items: baseline; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .pitem.active { background: var(--bg-hover); }
  .pname { color: var(--accent); font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; white-space: nowrap; }
  .pdesc { color: var(--text-dim); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .phint { padding: 6px 10px; color: var(--text-dim); font-size: 11.5px; }

  /* ── voice dock (replaces the composer during a live conversation) ──────── */
  #dock { display: none; max-width: var(--maxw); margin: 0 auto; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 2px; }
  body.voicing #dock { display: flex; }
  body.voicing .composer, body.voicing .hint, body.voicing .suggest { display: none !important; }
  #orb { width: 132px; height: 132px; cursor: pointer; border-radius: 50%; touch-action: none; }
  #orb:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .vstate { font-size: 15px; font-weight: 550; min-height: 24px; }
  .vsub { font-size: 12.5px; color: var(--text-dim); min-height: 18px; text-align: center; max-width: 520px; }
  .vctl { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
  .vbtn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-elev);
    color: var(--text); display: grid; place-items: center; cursor: pointer; position: relative; }
  .vbtn:hover { background: var(--bg-hover); }
  .vbtn.on { background: var(--err-soft); color: var(--err); border-color: transparent; }
  .vbtn.end { background: var(--err); color: #fff; border-color: transparent; width: 58px; border-radius: 99px; }
  .vbtn.end:hover { filter: brightness(1.08); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 99px; padding: 2px; background: var(--bg-elev); }
  .seg button { border: 0; background: transparent; color: var(--text-dim); font-size: 12.5px; padding: 5px 12px; border-radius: 99px; cursor: pointer; }
  .seg button.on { background: var(--bg-hover); color: var(--text); font-weight: 600; }

  /* ── Learn view ─────────────────────────────────────────────────────────── */
  #learnView { overflow-y: auto; }
  .learn { max-width: 860px; margin: 0 auto; padding: 8px 24px 48px; width: 100%; }
  .learn h1 { font-size: 28px; font-weight: 550; letter-spacing: -.3px; margin: 6px 0 4px; }
  .learn .lede { color: var(--text-dim); margin: 0 0 20px; }
  .langtabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; }
  .ltab { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 99px; padding: 6px 15px;
    font-size: 14px; cursor: pointer; }
  .ltab:hover { background: var(--bg-hover); }
  .ltab.on { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
  .ltab.add { color: var(--text-dim); border-style: dashed; }
  .addlang { display: inline-flex; gap: 6px; }
  .addlang input { background: var(--bg-input); border: 1px solid var(--border); color: var(--text); border-radius: 99px;
    padding: 6px 14px; font: inherit; font-size: 14px; width: 190px; outline: none; }
  .addlang input:focus { border-color: var(--accent); }

  .dsub { color: var(--text-dim); font-size: 14px; min-height: 20px; }

  .dmic .ico { width: 30px; height: 30px; }

  .dresult .verdict { font-weight: 650; margin-bottom: 6px; }

  .dresult .ans { font-size: 20px; font-weight: 600; }
  .wd { display: inline-block; margin: 0 3px; }
  .wd.hit { color: var(--ok); } .wd.miss { color: var(--err); text-decoration: underline wavy; text-underline-offset: 4px; }
  .dbtns { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .dsum { text-align: center; padding: 20px 0 6px; }
  .dsum .num { font-size: 44px; font-weight: 700; }

  @media (max-width: 820px) {

const STOP = {
  it: "il lo gli la le che di è non sono per una un ciao grazie sei mi ti del della anche molto bene questo questa oggi ho hai cosa perché sì",
  fr: "le la les des est et je tu vous nous une un pas ce cette bonjour merci très bien avec pour mais où comment oui",

const EN_STOP = new Set(("the and is are you to of that it what how this can your let's say means word we i my me it's do does with for " +
  "a an was were be been being he she they them his her its our their in on at by from but not no so as or if when where who which there has have had will would could should about into than then").split(" "));

// The preset language a text is plainly in: several of its function words, more
// than any other's, and few of English's. null when that is not plain — names

// than a plain one.
function plainlyIn(text){
  const words = text.toLowerCase().match(/[\p{L}']+/gu) || [];
  const hits = (set) => words.filter(w => set.has(w)).length;
  const en = hits(EN_STOP);
  const scores = PRESETS.filter(l => STOP_SETS[l.code]).map(l => [hits(STOP_SETS[l.code]), l]).sort((a, b) => b[0] - a[0]);

  return best[0] >= 3 && best[0] > next[0] && best[0] > en * 1.5 ? best[1] : null;
}
function looksTarget(text, lang){

  for (const w of text.toLowerCase().match(/[\p{L}']+/gu) || []) { if (set.has(w)) t++; if (EN_STOP.has(w)) e++; }

}

// ── tutor session state ──────────────────────────────────────────────────────

// The due items the tutor quizzes in the warm-up; the assessment grades them.

HOW TO WRITE — follow strictly:

- After each {{…}} phrase add its romanization in parentheses, e.g. {{你好}} (nǐ hǎo).` : ""}

TODAY'S LESSON:

Their goal: ${p.goals}.` : ""}${watch.length ? `
Mistakes they keep making (watch for these): ${watch.join("; ")}.` : ""}${(p.struggles || []).length ? `

// ── tiny Markdown renderer (no deps) ─────────────────────────────────────────
// Small local models sometimes write {phrase} instead of {{phrase}}; accept a
// single-braced run of words as a target-language phrase too.
function normBraces(s){ return s.replace(/(^|[^{])\{([\p{L}][\p{L}\p{M}' .,!?¿¡-]{0,60})\}(?!\})/gu, "$1{{$2}}"); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function inlineMd(s){
  // Transform outside inline code only, so `{{x}}` in code stays literal.
  return s.split(/(`[^`]+`)/g).map((part, i) => {
    if (i % 2) return `<code class="inline">${part.slice(1, -1)}</code>`;
    part = normBraces(part).replace(/\{\{([^{}]+?)\}\}/g, (_, t) => `<span class="tl" data-say="${t}" title="Click to hear it">${t}</span>`);
    part = part.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    part = part.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    part = part.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    part = part.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return part;
  }).join("");
}
function _tableCells(line){
  const t = line.trim().replace(/^\|/, "").replace(/\|$/, "");
  const cells = []; let cur = "";
  for (let i = 0; i < t.length; i++) {
    if (t[i] === "\\" && t[i + 1] === "|") { cur += "|"; i++; }
    else if (t[i] === "|") { cells.push(cur); cur = ""; }
    else cur += t[i];
  }
  cells.push(cur);
  return cells.map(c => c.trim());
}
function _tableAlign(line){
  if (!/\|/.test(line) || !/-/.test(line)) return null;
  const al = [];
  for (const c of _tableCells(line)) {
    if (!/^:?-+:?$/.test(c)) return null;
    al.push(c.startsWith(":") && c.endsWith(":") ? "center" : c.endsWith(":") ? "right" : c.startsWith(":") ? "left" : "");
  }
  return al;
}
function _renderTable(header, align, rows){
  const cell = (tag, txt, i) => `<${tag}${align[i] ? ` style="text-align:${align[i]}"` : ""}>${inlineMd(escapeHtml(txt))}</${tag}>`;
  const head = "<tr>" + header.map((h, i) => cell("th", h, i)).join("") + "</tr>";
  const body = rows.map(r => "<tr>" + header.map((_, i) => cell("td", r[i] != null ? r[i] : "", i)).join("") + "</tr>").join("");
  return `<table class="md"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}
function renderMarkdown(src){
  const out = [];
  for (const part of src.split(/(```[\s\S]*?```)/g)) {
    if (part.startsWith("```")) {
      const m = part.match(/^```[^\n]*\n?([\s\S]*?)```$/);
      const code = escapeHtml(m ? m[1].replace(/\n$/, "") : part.slice(3));
      out.push(`<div class="codewrap"><button class="copy">Copy</button><pre><code>${code}</code></pre></div>`);
      continue;
    }
    let para = [], listStack = [];
    const flushPara = () => { if (para.length) { out.push(`<p>${inlineMd(escapeHtml(para.join(" ")))}</p>`); para = []; } };
    const closeListsTo = (indent) => {
      while (listStack.length && listStack[listStack.length - 1].indent > indent) {
        const lvl = listStack.pop();
        const html = `<${lvl.tag}>${lvl.items.join("")}</${lvl.tag}>`;
        if (listStack.length) {
          const parent = listStack[listStack.length - 1];
          parent.items[parent.items.length - 1] = parent.items[parent.items.length - 1].replace(/<\/li>$/, html + "</li>");
        } else out.push(html);
      }
    };
    const flushList = () => closeListsTo(-1);
    const lines = part.split("\n");
    for (let li = 0; li < lines.length; li++) {
      const line = lines[li].replace(/\s+$/, ""); let m;
      if (!line.trim()) { flushPara(); flushList(); continue; }
      if ((m = line.match(/^\s*✏\uFE0F?\s*(.*)$/))) { flushPara(); flushList(); out.push(`<div class="corr">${icon("check")}<div>${inlineMd(escapeHtml(m[1]))}</div></div>`); continue; }
      if (/\|/.test(line) && li + 1 < lines.length && _tableAlign(lines[li + 1])) {
        flushPara(); flushList();
        const header = _tableCells(line), align = _tableAlign(lines[li + 1]), rows = [];
        let j = li + 2;
        for (; j < lines.length; j++) { if (!lines[j].trim() || !/\|/.test(lines[j])) break; rows.push(_tableCells(lines[j])); }
        out.push(_renderTable(header, align, rows)); li = j - 1; continue;
      }
      if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flushPara(); flushList(); const h = m[1].length; out.push(`<h${h}>${inlineMd(escapeHtml(m[2]))}</h${h}>`); continue; }
      if ((m = line.match(/^>\s?(.*)$/))) { flushPara(); flushList(); out.push(`<blockquote>${inlineMd(escapeHtml(m[1]))}</blockquote>`); continue; }
      let lm;
      if ((lm = line.match(/^(\s*)([-*+])\s+(.*)$/)) || (lm = line.match(/^(\s*)(\d+[.)])\s+(.*)$/))) {
        flushPara();
        const indent = lm[1].replace(/\t/g, "    ").length, tag = /\d/.test(lm[2]) ? "ol" : "ul";
        closeListsTo(indent);
        let top = listStack[listStack.length - 1];
        if (!top || indent > top.indent) { top = { tag, indent, items: [] }; listStack.push(top); }
        else if (top.tag !== tag) { closeListsTo(indent - 1); top = { tag, indent, items: [] }; listStack.push(top); }
        top.items.push(`<li>${inlineMd(escapeHtml(lm[3]))}</li>`);
        continue;
      }
      flushList(); para.push(line.trim());
    }
    flushPara(); flushList();
  }
  return out.join("");
}

// ── rendering ────────────────────────────────────────────────────────────────
function setFresh(on){ document.body.classList.toggle("fresh", !!on); }
function markLast(){

}
function setContent(wrap, text, cursor){ const el = wrap.querySelector(".content"); el.innerHTML = renderMarkdown(text); el.classList.toggle("cursor", !!cursor); }
function setThinking(wrap, text, live, secs){

}
function sysMsg(html, left){ const w = addBubble("system"); if (left) w.classList.add("left"); w.querySelector(".content").innerHTML = html; scrollDown(true); return w; }
function renderTool(wrap, ev){
  let tools = wrap.querySelector(".tools");
  if (!tools) { tools = document.createElement("div"); tools.className = "tools"; wrap.insertBefore(tools, wrap.querySelector(".content")); }
  if (ev.phase === "call") {
    const row = document.createElement("div"); row.className = "tool"; row.dataset.tid = ev.id || "";
    const a = ev.arguments || {};
    let label = `Used <code>${escapeHtml(ev.name || "")}</code>`, detail = "";
    if (a && typeof a === "object" && Object.keys(a).length) { try { detail = JSON.stringify(a); } catch {} if (detail.length > 120) detail = detail.slice(0, 120) + "…"; }
    if (ev.name === "web_search") { label = `<span class="tn">Searching the web</span>`; detail = a.query ? `“${a.query}”` : ""; }
    else if (ev.name === "web_fetch") { label = `<span class="tn">Reading</span>`; detail = a.url || ""; if (detail.length > 80) detail = detail.slice(0, 80) + "…"; }
    row.innerHTML = `<span class="tr"><span class="spin"></span></span> ${label}` + (detail ? ` <span class="args">${escapeHtml(detail)}</span>` : "");
    tools.appendChild(row);
  } else if (ev.phase === "result") {
    const row = [...tools.querySelectorAll(".tool[data-tid]")].reverse().find(r => r.dataset.tid === (ev.id || "")) || tools.lastElementChild;
    if (!row || !row.querySelector(".tr")) return;
    const content = String(ev.content || "");
    const img = content.match(/data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+/);
    row.querySelector(".tr").innerHTML = ev.denied ? `<span class="no">⛔</span>` : `<span class="${ev.ok ? "ok" : "no"}">${ev.ok ? "✓" : "✗"}</span>`;
    if (img) { const el = document.createElement("img"); el.className = "genimg"; el.src = img[0]; row.appendChild(el); return; }
    const oneLine = content.replace(/\s+/g, " ").trim();
    if (!oneLine) return;
    const res = document.createElement("span"); res.className = "res";
    res.innerHTML = escapeHtml(oneLine.slice(0, 110)) + (oneLine.length > 110 ? ` <span class="more">more</span>` : "");
    row.appendChild(res);
    if (oneLine.length > 110) {
      const full = document.createElement("span"); full.className = "resfull hidden"; full.textContent = content; row.appendChild(full);
      res.addEventListener("click", () => { const h = full.classList.toggle("hidden"); res.querySelector(".more").textContent = h ? "more" : "less"; });
    }
  } else if (ev.phase === "note") {
    const row = document.createElement("div"); row.className = "tool note"; row.textContent = ev.content || ""; tools.appendChild(row);
  }
}
function nearBottom(m){ return m.scrollHeight - m.scrollTop - m.clientHeight < 120; }
function scrollDown(force){ const m = $("scroller"); if (force || nearBottom(m)) m.scrollTop = m.scrollHeight; }
function plainText(md){ return md.replace(/\{\{([^{}]+)\}\}/g, "$1").replace(/^\s*✏\uFE0F?\s*/gm, ""); }
function addActions(wrap, text){
  if (wrap.querySelector(".actions")) return;
  const bar = document.createElement("div"); bar.className = "actions";
  bar.innerHTML = `<button class="iconbtn a-copy" data-tip="Copy" aria-label="Copy">${icon("copy")}</button>`
    + `<button class="iconbtn a-speak" data-tip="Read aloud" aria-label="Read aloud">${icon("speak")}</button>`
    + `<button class="iconbtn a-retry" data-tip="Retry" aria-label="Retry">${icon("retry")}</button>`;
  bar.querySelector(".a-copy").addEventListener("click", (e) => {
    navigator.clipboard?.writeText(plainText(text));
    const b = e.currentTarget; b.innerHTML = icon("check"); setTimeout(() => b.innerHTML = icon("copy"), 1200);
  });
  bar.querySelector(".a-speak").addEventListener("click", (e) => readAloud(e.currentTarget, text));

}
document.addEventListener("click", (e) => {
  const c = e.target.closest(".copy");
  if (c) { const code = c.parentElement.querySelector("code"); navigator.clipboard?.writeText(code.innerText).then(() => { c.textContent = "Copied"; setTimeout(() => c.textContent = "Copy", 1200); }); return; }
  const t = e.target.closest(".tl");
  if (t) { sayPhrase(t.dataset.say, t.closest("#thread") ? t : null); }
});

// ── backend plumbing (the client's /api/* proxy) ─────────────────────────────────
let cfgInfo = null;
async function loadConfig(){
  try { cfgInfo = await (await fetch("/api/config")).json(); } catch {}
}
async function refreshStatus(){
  try {
    const r = await fetch("/api/models", { cache: "no-store" });

// orb: a soft blob that breathes, swells with the user's voice, pulses with the
// assistant's, and shimmers while thinking.
let orbRaf = 0, orbLvl = 0, orbT = 0;
function orbStart(){ if (!orbRaf) orbRaf = requestAnimationFrame(orbDraw); }
function orbStop(){ if (orbRaf) cancelAnimationFrame(orbRaf); orbRaf = 0; }
function orbDraw(){
  orbRaf = voice.on ? requestAnimationFrame(orbDraw) : 0;
  const c = $("orb"), g = c.getContext("2d"), W = c.width, R = W / 2;
  if (!orbColors) { const cs = getComputedStyle(document.documentElement); orbColors = { a: cs.getPropertyValue("--accent").trim(), s: cs.getPropertyValue("--accent-strong").trim(), e: cs.getPropertyValue("--err").trim() }; }
  orbT += 1 / 60;
  const p = voice.phase;
  const raw = p === "speaking" ? veOutLevel() * 4 : (p === "listening" || p === "hearing" || p === "hold") ? VE.micLevel * 9 : 0;
  orbLvl += (Math.min(1, raw) - orbLvl) * 0.25;
  g.clearRect(0, 0, W, W);
  const base = R * 0.56 + Math.sin(orbT * 1.6) * R * 0.02 + orbLvl * R * 0.3;
  const col = VE.muted ? orbColors.e : orbColors.a;
  const halo = g.createRadialGradient(R, R, base * 0.6, R, R, R);
  halo.addColorStop(0, col + "55"); halo.addColorStop(1, col + "00");
  g.fillStyle = halo; g.beginPath(); g.arc(R, R, R, 0, Math.PI * 2); g.fill();
  g.beginPath();
  const pts = 64;
  for (let i = 0; i <= pts; i++) {
    const a = i / pts * Math.PI * 2;
    const wob = (p === "thinking" || p === "transcribing" ? 0.05 : 0.025 + orbLvl * 0.07) *
      (Math.sin(a * 3 + orbT * 2.1) + Math.sin(a * 5 - orbT * 1.3) * 0.6);
    const r = base * (1 + wob);
    const x = R + Math.cos(a) * r, y = R + Math.sin(a) * r;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  const fill = g.createRadialGradient(R - base * 0.3, R - base * 0.35, base * 0.1, R, R, base * 1.1);
  fill.addColorStop(0, VE.muted ? col : orbColors.s); fill.addColorStop(1, col);
  g.fillStyle = fill; g.fill();
  if (p === "thinking" || p === "transcribing") {
    g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 3; g.lineCap = "round";
    g.beginPath(); g.arc(R, R, base * 0.62, orbT * 3, orbT * 3 + 1.2); g.stroke();
  }
}

function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim(); }
function similarity(a, b){

  const m = a.length, n = b.length, d = Array.from({ length: n + 1 }, (_, j) => j);

  return 1 - d[n] / Math.max(m, n);
}

  const L = Array.from({ length: T.length + 1 }, () => new Array(H.length + 1).fill(0));
  for (let i = T.length - 1; i >= 0; i--) for (let j = H.length - 1; j >= 0; j--) L[i][j] = eq(T[i], H[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const hit = new Array(T.length).fill(false); let i = 0, j = 0;
  while (i < T.length && j < H.length) { if (eq(T[i], H[j])) { hit[i] = true; i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  return { words: T.map((w, k) => ({ w, hit: hit[k] })), score: T.length ? hit.filter(Boolean).length / T.length : 0 };
}
const drill = { lang: null, mode: "", items: [], i: 0, passed: 0, reviewed: 0, listen: null, busy: false };
async function openDrill(lang, mode){
  if (voice.on) stopVoice();
  let items = [];
  try {
    if (mode === "review") {
      items = (await (await fetch(`/api/tutor/${encodeURIComponent(lang.key)}/due?limit=12`)).json()).items || [];
      if (!items.length) { const all = (await (await fetch(`/api/tutor/${encodeURIComponent(lang.key)}/items`)).json()).items || []; items = all.sort((a, b) => a.box - b.box || a.due - b.due).slice(0, 10); }
    } else {
      const all = (await (await fetch(`/api/tutor/${encodeURIComponent(lang.key)}/items`)).json()).items || [];
      items = all.filter(i => i.kind !== "correction" || i.text).sort((a, b) => a.box - b.box).slice(0, 10).map(i => ({ ...i, text: splitCorrection(i).right }));
    }
  } catch {}
  if (!items.length) return;
  Object.assign(drill, { lang, mode, items, i: 0, passed: 0, reviewed: 0, busy: false });
  $("drillTitle").textContent = mode === "review" ? `${lang.name} review` : `${lang.name} pronunciation`;
  $("drillScrim").classList.remove("hidden");
  try { await veOpen(); drill.mic = true; } catch { drill.mic = false; }
  renderCard();
}
function closeDrill(){
  drill.listen?.cancel(); drill.listen = null; veStopAudio();
  if (drill.mic) { veClose(); drill.mic = false; }
  $("drillScrim").classList.add("hidden");
  if (drill.reviewed) {
    fetch(`/api/tutor/${encodeURIComponent(drill.lang.key)}/drill`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: drill.mode === "review" ? "flashcards" : "pronunciation", reviewed: drill.reviewed, passed: drill.passed }) }).catch(() => {});
  }
  drill.reviewed = 0;
  refreshDue();
  if (!$("learnView").classList.contains("hidden") && learnLang) loadLearn(learnLang);
}
function cardSpec(it){
  if (drill.mode === "pronounce") return { kind: "Say it like a native", prompt: it.text, sub: it.gloss || "", answer: it.text, say: it.text, pron: true };
  if (it.kind === "correction") { const c = splitCorrection(it); return { kind: "Fix the mistake", prompt: c.wrong || "", strike: !!c.wrong, sub: c.wrong ? (it.note || "Say it correctly") : "Say the correct form", answer: c.right, ask: c.wrong ? "How do you say this correctly?" : "" }; }
  if (it.gloss) return { kind: it.kind === "phrase" ? "Phrase" : "Word", prompt: `“${it.gloss}”`, sub: `Say it in ${drill.lang.name}`, answer: it.text, ask: `How do you say: ${it.gloss}?` };
  return { kind: "Repeat after me", prompt: it.text, sub: "Listen, then say it", answer: it.text, say: it.text, pron: true };
}
function renderCard(){
  const total = drill.items.length;
  $("dprog").style.width = (drill.i / total * 100) + "%";
  if (drill.i >= total) return renderDrillSummary();
  $("dcount").textContent = `${drill.i + 1} of ${total}`;
  const it = drill.items[drill.i], spec = cardSpec(it);
  $("drillBody").innerHTML = `<div class="dcard">
      <div class="dkind">${escapeHtml(spec.kind)}</div>
      <div class="dprompt${spec.strike ? " strike" : ""}">${escapeHtml(spec.prompt)}</div>
      <div class="dsub">${escapeHtml(spec.sub)}</div>
      ${drill.mic ? `<button class="dmic" id="dmic" aria-label="Answer out loud">${icon("mic")}</button><div class="dsub" id="dhint">Tap and speak</div>` : `<div class="dsub">Microphone unavailable — type your answer.</div>`}
      <form class="dtype" id="dtype"><input placeholder="…or type it" aria-label="Type your answer"><button class="ghostbtn" type="submit">Check</button></form>
      <div class="dbtns"><button class="ghostbtn" id="dreveal">Show answer</button>${spec.say ? `<button class="ghostbtn" id="dhear">${icon("speak")}Hear it</button>` : ""}</div>
      <div id="dres"></div></div>`;
  const lv = drill.lang.voice || "";
  veStopAudio();
  if (spec.say) veSay(spec.say, lv, { tail: 150 });
  else if (spec.ask) veSay(spec.ask, enVoice(), { tail: 150 });
  $("dhear")?.addEventListener("click", () => { veStopAudio(); veSay(spec.say, lv, { tail: 150 }); });
  $("dreveal").addEventListener("click", () => grade(spec, null));
  $("dtype").addEventListener("submit", (e) => { e.preventDefault(); const v = e.target.querySelector("input").value.trim(); if (v) grade(spec, v); });
  $("dmic")?.addEventListener("click", () => listenAnswer(spec));
}
async function listenAnswer(spec){
  const btn = $("dmic"), hint = $("dhint");
  if (drill.listen) { drill.listen.end(); return; }
  await veIdle();                                     // don't record the prompt audio
  btn.classList.add("live"); hint.textContent = "Listening… tap when done";
  drill.listen = veListen({ endMs: 1200, maxMs: 15000 });
  const lvl = setInterval(() => { btn.style.boxShadow = `0 0 0 ${Math.min(18, VE.micLevel * 160)}px var(--accent-soft)`; }, 50);
  const chunks = await drill.listen.result; drill.listen = null; clearInterval(lvl);
  if (!btn.isConnected) return;
  btn.classList.remove("live"); btn.style.boxShadow = "";
  if (!chunks) { hint.textContent = "Didn't catch that — tap and try again"; return; }
  hint.textContent = "Checking…"; btn.disabled = true;
  const r = await transcribe(veWav(chunks), drill.lang.code);
  if (!btn.isConnected) return;
  btn.disabled = false;
  if (r.error) { hint.textContent = "Couldn't transcribe: " + r.error; return; }
  hint.textContent = "";
  grade(spec, r.text || "", true);
}
function grade(spec, said, spoken){
  if (drill.busy) return;
  const it = drill.items[drill.i], lv = drill.lang.voice || "";
  let verdict = "fail", html = "";
  if (said == null) verdict = "reveal";
  else if (spec.pron) {
    const d = wordDiff(spec.answer, said);
    verdict = d.score >= 0.85 ? "pass" : d.score >= 0.5 ? "close" : "fail";
    html = `<div>${d.words.map(x => `<span class="wd ${x.hit ? "hit" : "miss"}">${escapeHtml(x.w)}</span>`).join(" ")}</div><div class="heard">Heard: “${escapeHtml(said || "…")}” · ${Math.round(d.score * 100)}%</div>`;
  } else {
    const s = similarity(said, spec.answer);
    // Speech recognition mangles a word or two; be lenient for spoken answers.
    verdict = s >= (spoken ? 0.75 : 0.85) ? "pass" : s >= 0.5 ? "close" : "fail";
    html = `<div class="heard">You said: “${escapeHtml(said || "…")}”</div>`;
  }
  const label = { pass: "Nice — that's right!", close: "Close!", fail: "Not quite", reveal: "Answer" }[verdict];
  $("dres").innerHTML = `<div class="dresult ${verdict === "reveal" ? "close" : verdict}"><div class="verdict">${label}</div>`
    + (spec.pron ? "" : `<div class="ans"><span class="tl" data-say="${escapeHtml(spec.answer)}">${escapeHtml(spec.answer)}</span></div>`) + html + `</div>`
    + `<div class="dbtns">${verdict === "pass" ? `<button class="bigbtn" id="dnext">Next</button>` :
        `<button class="ghostbtn" id="dagain">${spec.pron ? "Try again" : "Again"}</button><button class="${verdict === "close" ? "bigbtn" : "ghostbtn"}" id="dgot">${verdict === "close" ? "Count it" : "I knew it"}</button><button class="bigbtn" id="dmiss">Next</button>`}</div>`;
  veStopAudio(); veSay(spec.answer, lv, { tail: 150 });
  const advance = async (passed) => {
    if (drill.busy) return; drill.busy = true;
    drill.reviewed++; if (passed) drill.passed++;
    try { await fetch(`/api/tutor/${encodeURIComponent(drill.lang.key)}/review`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: it.id, passed }) }); } catch {}
    drill.busy = false; drill.i++; renderCard();
  };
  $("dnext")?.addEventListener("click", () => advance(true));
  $("dgot")?.addEventListener("click", () => advance(true));
  $("dmiss")?.addEventListener("click", () => advance(false));
  $("dagain")?.addEventListener("click", () => { $("dres").innerHTML = ""; if (spec.say) { veStopAudio(); veSay(spec.say, lv, { tail: 150 }); } });
  ($("dnext") || $("dmiss")).focus();
}
function renderDrillSummary(){
  $("dcount").textContent = "";
  $("drillBody").innerHTML = `<div class="dsum"><div class="num">${drill.passed}/${drill.reviewed}</div><p class="muted">${drill.passed === drill.reviewed ? "Perfect round." : "Missed ones come back sooner — that's how they stick."}</p>
    <div class="dbtns"><button class="bigbtn" id="ddone">Done</button></div></div>`;
  $("ddone").addEventListener("click", closeDrill); $("ddone").focus();
}
$("drillClose").addEventListener("click", closeDrill);
$("drillScrim").addEventListener("click", (e) => { if (e.target === $("drillScrim")) closeDrill(); });

// ── settings ─────────────────────────────────────────────────────────────────
let settingsTab = "general";
function openSettings(tab){ settingsTab = tab || settingsTab; $("settingsScrim").classList.remove("hidden"); renderSettings(); }
function closeSettings(){ $("settingsScrim").classList.add("hidden"); }
$("settingsBtn").addEventListener("click", () => openSettings());
$("settingsClose").addEventListener("click", closeSettings);
$("settingsScrim").addEventListener("click", (e) => { if (e.target === $("settingsScrim")) closeSettings(); });
$("settingsTabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; settingsTab = b.dataset.tab; renderSettings(); });
function segHtml(id, opts, val){ return `<div class="seg" id="${id}">${opts.map(([v, l]) => `<button data-v="${v}" class="${v === val ? "on" : ""}">${l}</button>`).join("")}</div>`; }
function bindSeg(id, fn){ $(id)?.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; fn(b.dataset.v); renderSettings(); }); }
// Voice picker: hearth lists its voices with labels like "George — male (UK)";
// group them by accent so US/UK and male/female are easy to compare.
async function renderVoicePicker(){
  const sel = $("setVoice"), btn = $("setVoiceTry"); if (!sel) return;
  let v = { voices: [], default: null, selected: "" };
  try { v = await (await fetch("/api/voices")).json(); } catch {}
  if (!sel.isConnected) return;
  const accent = (x) => /\(UK\)|en_GB/.test(x.label || x.id) ? "British English" : /\(US\)|en_US/.test(x.label || x.id) ? "American English" : "Other";
  const groups = {};
  for (const x of v.voices || []) (groups[accent(x)] ||= []).push(x);
  const def = v.default?.id ? ` (${(v.voices.find(x => x.id === v.default.id)?.label || v.default.id).split(" —")[0]})` : "";
  let html = `<option value="">Backend default${escapeHtml(def)}</option>`;
  for (const g of ["American English", "British English", "Other"]) if (groups[g])
    html += `<optgroup label="${g}">${groups[g].map(x => `<option value="${escapeHtml(x.id)}">${escapeHtml(x.label || x.id)}</option>`).join("")}</optgroup>`;
  if (v.selected && !(v.voices || []).some(x => x.id === v.selected)) html += `<option value="${escapeHtml(v.selected)}">${escapeHtml(v.selected)}</option>`;
  sel.innerHTML = html; sel.value = v.selected || "";
  const model = () => (v.voices || []).find(x => x.id === sel.value)?.model || "";
  const preview = () => { veStopAudio(); veSay("Hi! This is how I'll sound when we talk.", sel.value, { tail: 150, model: model() }); };
  sel.addEventListener("change", async () => {
    let ok = false;
    try { ok = (await fetch("/api/voice", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ voice: sel.value, model: model() }) })).ok; } catch {}
    await loadConfig();
    if (ok) preview(); else sel.value = cfgInfo?.tts_voice || "";
  });
  btn.addEventListener("click", preview);
}
async function renderSettings(){
  document.querySelectorAll("#settingsTabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === settingsTab));
  const el = $("settingsBody");
  if (settingsTab === "general") {
    el.innerHTML = `<div class="setrow"><div class="lbl"><div class="t">Appearance</div></div>${segHtml("setTheme", [["system", "System"], ["light", "Light"], ["dark", "Dark"]], prefs.theme)}</div>`;
    bindSeg("setTheme", v => { prefs.theme = v; savePrefs(); applyTheme(); });
  } else if (settingsTab === "voice") {
    el.innerHTML = `<div class="setrow"><div class="lbl"><div class="t">Voice</div><div class="s">Who speaks English replies. Lessons still use a native voice for the language you're learning.</div></div><select class="lvlsel" id="setVoice" aria-label="Voice"><option>Loading…</option></select><button class="ghostbtn" id="setVoiceTry" aria-label="Preview voice">${icon("speak")}Preview</button></div>
      <div class="setrow"><div class="lbl"><div class="t">Taking turns</div><div class="s">Hands-free answers when you pause; hold-to-talk records only while Space or the orb is held.</div></div>${segHtml("setTurn", [["auto", "Hands-free"], ["hold", "Hold to talk"]], prefs.turn)}</div>
      <div class="setrow"><div class="lbl"><div class="t">Pause before replying</div><div class="s">How long a silence ends your turn. Lessons add half a second — learners need time to think.</div></div>${segHtml("setPat", [["quick", "Quick"], ["normal", "Normal"], ["patient", "Patient"]], prefs.patience)}</div>
      <div class="setrow"><div class="lbl"><div class="t">Interrupt by speaking</div><div class="s">Start talking to cut in. Turn off if it interrupts itself on loud speakers — tapping the orb always works.</div></div><button class="sw${prefs.barge ? " on" : ""}" id="setBarge" role="switch" aria-checked="${prefs.barge}"></button></div>`;
    bindSeg("setTurn", v => setTurnMode(v));
    bindSeg("setPat", v => { prefs.patience = v; savePrefs(); });
    $("setBarge").addEventListener("click", () => { prefs.barge = !prefs.barge; savePrefs(); renderSettings(); });
    renderVoicePicker();
  } else if (settingsTab === "backend") {
    el.innerHTML = `<div class="muted">Loading…</div>`;
    try {
      const c = await (await fetch("/api/config")).json();
      el.innerHTML = `<p class="muted">Chat goes to the selected backend. Local is the default; cloud backends are explicit opt-ins in config.yaml.</p>`
        + (c.providers || []).map(p => `<div class="setrow"><div class="lbl"><div class="t">${escapeHtml(p)}</div><div class="s">${p === c.provider ? escapeHtml(c.backend) : ""}</div></div>${p === c.provider ? `<span class="tag okt">Active</span>` : `<button class="ghostbtn" data-p="${escapeHtml(p)}">Use</button>`}</div>`).join("");
      el.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", async () => { await fetch(`/api/provider/${encodeURIComponent(b.dataset.p)}`, { method: "POST" }); await loadConfig(); refreshStatus(); renderSettings(); }));
    } catch { el.innerHTML = `<div class="muted">Couldn't load backends.</div>`; }
  } else {
    el.innerHTML = `<div class="muted">Loading…</div>`;
    try {
      const [s, t] = await Promise.all([fetch("/api/servers").then(r => r.json()), fetch("/api/tools").then(r => r.json())]);
      let html = `<p class="muted">MCP servers give the model tools. Tools run only if allowed by the server's auto_approve list.</p>`;
      html += (s.servers || []).length ? s.servers.map(x => `<div class="setrow"><div class="lbl"><div class="t">${escapeHtml(x.name)}</div><div class="s">${escapeHtml(x.command)} ${escapeHtml((x.args || []).join(" "))}${(s.errors || {})[x.name] ? ` · ⚠ ${escapeHtml(s.errors[x.name])}` : ""}</div></div><button class="sw${x.enabled ? " on" : ""}" role="switch" aria-checked="${x.enabled}" data-s="${escapeHtml(x.name)}" data-on="${x.enabled}" aria-label="${escapeHtml(x.name)}"></button></div>`).join("")
        : `<div class="muted">No MCP servers configured — add them in config.yaml (<code>hearth client config edit</code>).</div>`;
      if ((t.tools || []).length) html += `<h4 class="muted" style="margin:18px 0 4px">${t.tools.length} tools available</h4>` + t.tools.map(x => `<div class="setrow"><div class="lbl"><div class="t"><code class="inline">${escapeHtml(x.name)}</code></div><div class="s">${escapeHtml((x.description || "").slice(0, 110))}</div></div></div>`).join("");
      el.innerHTML = html;
      el.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", async () => {
        b.disabled = true;
        await fetch(`/api/mcp/${encodeURIComponent(b.dataset.s)}/${b.dataset.on === "true" ? "disable" : "enable"}`, { method: "POST" });
        renderSettings();
      }));
    } catch { el.innerHTML = `<div class="muted">Couldn't load tools.</div>`; }
  }
}

function setSide(collapsed){ prefs.sideCollapsed = collapsed; savePrefs(); document.body.classList.toggle("side-collapsed", collapsed); }
function closeSideOnMobile(){ if (window.matchMedia("(max-width: 820px)").matches) document.body.classList.add("side-collapsed"); }
document.body.classList.toggle("side-collapsed", prefs.sideCollapsed || window.matchMedia("(max-width: 820px)").matches);
$("sideClose").addEventListener("click", () => setSide(true));
$("sideOpen").addEventListener("click", () => setSide(false));
$("sideScrim").addEventListener("click", () => document.body.classList.add("side-collapsed"));
$("navNew").addEventListener("click", newChat);
$("navLearn").addEventListener("click", showLearn);
$("suggest").addEventListener("click", (e) => {
  const b = e.target.closest(".sbtn"); if (!b) return;
  if (b.dataset.act === "voice") startVoice(); else if (b.dataset.act === "learn") showLearn(); else $("file").click();
});
function autogrow(){ const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 240) + "px"; }
$("input").addEventListener("input", () => { autogrow(); updatePalette(); syncSendBtn(); });
$("input").addEventListener("blur", () => setTimeout(hidePalette, 120));
$("input").addEventListener("keydown", (e) => {
  if (palOpen()) {
    if (e.key === "ArrowDown") { e.preventDefault(); palActive = Math.min(palActive + 1, palItems.length - 1); renderActive(); return; }
    if (e.key === "ArrowUp")   { e.preventDefault(); palActive = Math.max(palActive - 1, 0); renderActive(); return; }
    if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)) { e.preventDefault(); acceptPalette(); return; }
    if (e.key === "Escape")    { e.preventDefault(); e.stopPropagation(); hidePalette(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("sendbtn").addEventListener("click", send);
$("model").addEventListener("change", (e) => { model = e.target.value; });
$("think").addEventListener("click", () => { deepThink = !deepThink; $("think").classList.toggle("on", deepThink); $("think").setAttribute("aria-pressed", String(deepThink)); });
const typing = (e) => /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !palOpen()) {
    if (!$("drillScrim").classList.contains("hidden")) return closeDrill();
    if (!$("settingsScrim").classList.contains("hidden")) return closeSettings();
    if (voice.on) return stopVoice();
    if (streaming) controller?.abort();
    return;
  }
  if (voice.on && !typing(e)) {
    if (e.code === "Space") {
      e.preventDefault();
      if (e.repeat) return;
      if (prefs.turn === "hold") { if (voice.phase === "speaking" || voice.phase === "thinking") voice.interrupt?.(); holdDown = true; }
      else orbTap();
      return;
    }
    if (e.key === "m" || e.key === "M") { $("vmute").click(); return; }
  }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "o" || e.key === "O")) { e.preventDefault(); newChat(); }
});
document.addEventListener("keyup", (e) => { if (e.code === "Space") holdDown = false; });
function relTime(ts){
  if (!ts) return "";
  const s = Date.now() / 1000 - ts;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 2 * 86400) return "yesterday";
  return Math.floor(s / 86400) + " days ago";
}
function greet(){
  const h = new Date().getHours();
  $("greet").textContent = h < 5 ? "Up late?" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
}

greet(); syncSendBtn(); syncVoiceControls();
loadConfig().then(refreshStatus); setInterval(refreshStatus, 5000);
refreshRecents(); refreshDue();
