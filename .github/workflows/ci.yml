name: ci

on:
  push:
    branches: [main, engine]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: The built wheel starts and names its version
        run: |
          pip wheel --no-deps -w dist .
          python -m venv /tmp/wheel && /tmp/wheel/bin/pip install -q dist/*.whl
          cd /tmp && /tmp/wheel/bin/python -c "import hearth, importlib.metadata as m; assert m.version('hearth') == hearth.__version__, m.version('hearth')"
          /tmp/wheel/bin/hearth hardware
          HEARTH_HOME=/tmp/hearth-home /tmp/wheel/bin/hearth start --no-manage & PID=$!
          for i in $(seq 30); do curl -sf localhost:11435/admin/version && break; sleep 1; done
          curl -sf localhost:11435/admin/version | grep -q '"name":"hearth"'
          curl -sf localhost:11435/app | grep -qi '<html'
          kill $PID
