name: ci

on:
  push:
    branches: [main, engine]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: The lock file is current
        run: uv lock --check
      # Each in an environment of its own, as they are installed.
      - name: hearth
        run: |
          uv sync --frozen --package hearth --extra dev
          uv run --frozen --package hearth --extra dev pytest -q --durations=5 packages/hearth tests
      - name: hearth-client
        run: |
          uv sync --frozen --package hearth-client --extra dev
          uv run --frozen --package hearth-client --extra dev pytest -q packages/client
      - name: The built hearth starts, answers and stops
        run: |
          uv build --wheel --package hearth -o dist
          uv venv -q wheel && uv pip install -q --python wheel dist/hearth-*.whl
          BIN=wheel/bin; [ -d wheel/Scripts ] && BIN=wheel/Scripts
          export HEARTH_HOME="$PWD/hearth-home"
          "$BIN/hearth" model suggest --json
          "$BIN/hearth" start --no-manage
          curl -sf http://127.0.0.1:11435/admin/version | grep -q '"name":"hearth"'
          curl -sf http://127.0.0.1:11435/ | grep -q '<title>hearth setup</title>'
          curl -sf http://127.0.0.1:11435/admin/setup | grep -q '"verdict"'
          "$BIN/hearth" stop
          ! curl -sf http://127.0.0.1:11435/admin/version

  # The scripts themselves, on a computer with nothing on it.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HEARTH_E2E: "1"
      PYTHONUTF8: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Everything a release needs has a wheel for this system, and works
        run: |
          python3 tools/release.py out || python tools/release.py out
          for name in hearth client; do
            uv venv -q "env-$name"
            uv pip install -q --python "env-$name" --require-hashes --only-binary :all: -r "out/$name-requirements.txt"
            uv pip install -q --python "env-$name" --no-deps --no-index out/$([ $name = client ] && echo hearth_client || echo hearth)-0*.whl
          done
          PY=bin/python; [ -d env-hearth/Scripts ] && PY=Scripts/python.exe
          env-hearth/$PY -c "import hearth.app, kokoro_onnx, faster_whisper; from hearth import provision as p, kokoro_tts as k; assert p.stt_possible() and k.package_present()"
          # (a recording is read: importing it says nothing about what it is read with)
          env-hearth/$PY -c "import io, wave; from faster_whisper.audio import decode_audio as d; b = io.BytesIO(); w = wave.open(b, 'wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(bytes(32000)); w.close(); b.seek(0); assert len(d(b)) == 16000"
          env-client/$PY -c "import hearth_client.app, hearth_client.mcp_servers.rag, hearth_client.mcp_servers.web, hearth_client.mcp_servers.image"
          # hearth's search backend: installed as install.build_env does it, then run
          uv venv -q env-searxng
          uv pip install -q --python env-searxng --require-hashes --only-binary :all: -r out/searxng-requirements.txt
          uv pip install -q --python env-searxng --no-deps --no-index out/searxng-*.whl
          env-searxng/$PY tools/searxng_check.py
          rm -rf env-hearth env-client env-searxng out
      - name: Install, update, go back, remove
        run: |
          uv sync --frozen --package hearth --extra dev
          uv run --frozen --package hearth --extra dev pytest -v -x --durations=5 tests/test_install.py

  # The release's real Ollama, and a model small enough for a computer without a GPU.
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HEARTH_E2E_OLLAMA: "1"
      PYTHONUTF8: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install with Ollama, get a model, ask it, remove everything
        run: |
          uv sync --frozen --package hearth --extra dev
          uv run --frozen --package hearth --extra dev pytest -v -s -x tests/test_engine.py
