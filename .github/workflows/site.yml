name: site

# https://yumima.github.io/hearth/ : site/, and the latest release's install scripts.
# Only main may deploy it, and a release runs from its tag: that starts a run on main.
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  schedule:
    - cron: "47 6 * * *"  # the download count in the page

permissions:
  contents: read

jobs:
  again-on-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "${{ github.repository }}" --ref main

  build:
    if: github.event_name != 'release'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The install scripts, as released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern 'install.*' --pattern SHA256SUMS --dir scripts
          (cd scripts && grep ' install\.' SHA256SUMS | sha256sum -c -)
          cp scripts/install.sh scripts/install.ps1 site/
      - name: Its version, date and download count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view --repo "${{ github.repository }}" --json tagName,publishedAt > release.json
          v=$(jq -r '.tagName | ltrimstr("v")' release.json)
          d=$(date -u -d "$(jq -r .publishedAt release.json)" '+%-d %B %Y')
          n=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].assets[] | select(.name | test("^hearth-.*[.]whl$")) | .download_count' | jq -s 'add // 0')
          clones=$(sed -n 's/.*data-clones="\([0-9]*\)".*/\1/p' site/index.html)
          sed -i "s/@VERSION@/$v/; s/@DATE@/$d/; s/@DOWNLOADS@/$n/; s/@TOTAL@/$((clones + n))/" site/index.html
          ! grep -n "@[A-Z]*@" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # A job of its own, and tried again: deploy-pages asks once which artifacts the
  # run has, and GitHub can take a moment to list a finished upload.
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: read
    concurrency:
      group: pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url }}
    steps:
      - id: try1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with: { timeout: 360000 }
      - if: steps.try1.outcome == 'failure'
        run: sleep 20
      - id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with: { timeout: 360000 }
      - if: steps.try2.outcome == 'failure'
        run: sleep 60
      - id: try3
        if: steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with: { timeout: 360000 }
