name: site

# https://yumima.github.io/hearth/ : site/, and the latest release's install scripts.
# Only main may deploy it, and a release runs from its tag: that starts a run on main.
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: read

jobs:
  again-on-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "${{ github.repository }}" --ref main

  deploy:
    if: github.event_name != 'release'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: The install scripts, as released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern 'install.*' --pattern SHA256SUMS --dir scripts
          (cd scripts && grep ' install\.' SHA256SUMS | sha256sum -c -)
          cp scripts/install.sh scripts/install.ps1 site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
